[tools]
python = "3.12"
uv = "latest"
pre-commit = "latest"
nfpm = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[settings]
python.uv_venv_auto = "create|source"
python.compile = false
experimental = true

[tasks.sync]
description = "Sync uv"
run = "mise x -- uv sync --group dev --group build"

[tasks.pre-commit]
description = "Install and pre-commit"
run = "pre-commit install"

[tasks.dev]
description = "Run the typer client (use --profile to specify profile from profile.toml)"
run = "uv run src/maws/main.py $@"
depends = ["openapi-client-generator"]

[tasks.test]
description = "Run the pytests"
run = "uv run pytest --maxfail=1 --cov --cov-report=term-missing"
depends = ["openapi-client-generator"]

[tasks.coverage]
description = "Get test coverage report"
run = "uv run coverage report"

[tasks."docs:serve"]
description = "Serve the mkdocs documentation locally with live reload"
run = "uv run --group docs mkdocs serve"

[tasks."docs:build"]
description = "Build the mkdocs documentation into ./site"
run = "uv run --group docs mkdocs build --strict"

[hooks]
postinstall = ["mise pre-commit"]
enter = [
  "mise x -- uv sync --group dev --group build",
]
