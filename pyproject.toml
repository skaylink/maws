[project]
name = "maws"
version = "26.8.0"
description = "Managed AWS command line client"
authors = [
  { name = "Jochen Werner", email = "jochen.werner@skaylink.com" },
  { name = "Stefan Heitmüller", email = "stefan.heitmueller@skaylink.com" },
]
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "typer==0.26.8",
  "rich==15.0.0",
  "openapi-python-client==0.29.0",
  "mypy-extensions==1.1.0",
  "pathspec==1.1.1",
]

[project.urls]
Repository = "https://github.com/skaylink/maws"

[project.scripts]
maws = "maws.main:main"

[dependency-groups]
dev = [
  "faker==40.36.0",
  "pytest==9.1.1",
  "pytest-env==1.6.0",
  "pytest-cov==7.1.0",
]
build = [
  "nuitka==4.1.3",
  "zstandard>=0.25.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.9.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "maws"

[tool.pytest_env]
ENDPOINT = "http://dummy-host"
SECRET = "dummy-cmapi-secret"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = """-vv"""

[tool.coverage.run]
omit = ["tests/*", "src/maws/clients/*"]

[tool.black]
line-length = 120
