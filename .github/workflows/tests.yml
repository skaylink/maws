---
name: tests
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    env:
      API_BASE_URL: https://example.com
      API_ACCESS_KEY: this-is-my-secret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup mise runtime manager
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
          experimental: true
      - name: Install mise
        run: mise install
      - name: Install Python dependencies
        run: uv sync
      - name: Run tests
        run: mise test --cov-fail-under=95
      - name: Create coverage report
        run: echo "<pre>`mise coverage`<pre>" >> $GITHUB_STEP_SUMMARY
  exe:
    runs-on: ubuntu-latest
    needs: test
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise runtime manager
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
          experimental: true
      - name: Install mise toolchain
        run: mise install
      - name: Build exe
        run: mise build:exe
        env:
          DEBUG: ${{ runner.debug }}
  binary:
    runs-on: ubuntu-latest
    needs: test
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise runtime manager
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
          experimental: true
      - name: Install mise toolchain
        run: mise install
      - name: Build binary
        run: mise build:binary
        env:
          DEBUG: ${{ runner.debug }}
