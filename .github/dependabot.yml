# Dependabot version updates.
# Security updates run separately via the repo security settings.
version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - python
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    uv-minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    docker-minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /.docker/build/windows
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    docker-minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - github-actions
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
      - '*'
